name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A chave fica nos Secrets do repositório. Sem ela o APK sai assinado com chave de
      # debug (só para teste) e nenhuma Release é publicada.
      - name: Chave de assinatura
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KEYSTORE_BASE64 não configurado: APK de teste, sem Release. Veja o README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Testes e build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "MassivasFai-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MassivasFai-${{ env.VERSION_NAME }}
          path: MassivasFai-${{ env.VERSION_NAME }}.apk

      # Só a branch principal publica Release (é dela que o app puxa as atualizações).
      - name: Publicar Release
        if: steps.key.outputs.ok == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Massivas Fai ${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          files: MassivasFai-${{ env.VERSION_NAME }}.apk
          make_latest: "true"
